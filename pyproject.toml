[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-uz-crawler"
version = "1.0.0"
description = "Sequential, resumable public Lex.uz document archiver"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "filelock>=3.15,<4", "pypdf>=5,<7"]

[project.scripts]
lex-crawl = "lex_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["lex_crawler*"]
